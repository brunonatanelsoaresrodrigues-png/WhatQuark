server {
    listen 80;
    server_name _;

    index index.html;
    root /var/www/public/;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
        include include.d/nocache.conf;
    }

    location /static {
        alias /var/www/public/static/;
        include include.d/allcache.conf;
    }

    include include.d/spa.conf;
}
