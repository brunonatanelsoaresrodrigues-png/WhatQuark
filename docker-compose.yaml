version: '3'

networks:
  whaticket:

services:

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    environment:
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-wwebjs}
      - MESSAGING_MODE=${MESSAGING_MODE:-simulation}
      - MESSAGING_TEST_ALLOWLIST=${MESSAGING_TEST_ALLOWLIST:-}
      - MESSAGING_MAX_PER_HOUR=${MESSAGING_MAX_PER_HOUR:-100}
      - MESSAGING_MIN_INTERVAL_SECONDS=${MESSAGING_MIN_INTERVAL_SECONDS:-2}
      - MESSAGING_MAX_NOTICES_PER_DAY=${MESSAGING_MAX_NOTICES_PER_DAY:-3}
      - BOT_FALLBACK_QUEUE_ID=${BOT_FALLBACK_QUEUE_ID:-}
      - DASHBOARD_SLA_MINUTES=${DASHBOARD_SLA_MINUTES:-5}
      - CLOUD_WHATSAPP_ID=${CLOUD_WHATSAPP_ID:-}
      - CLOUD_PHONE_NUMBER_ID=${CLOUD_PHONE_NUMBER_ID:-}
      - CLOUD_API_VERSION=${CLOUD_API_VERSION:-}
      - CLOUD_ACCESS_TOKEN=${CLOUD_ACCESS_TOKEN:-}
      - CLOUD_APP_SECRET=${CLOUD_APP_SECRET:-}
      - CLOUD_VERIFY_TOKEN=${CLOUD_VERIFY_TOKEN:-}
      - CLOUD_QUARK_APPOINTMENT_TEMPLATE=${CLOUD_QUARK_APPOINTMENT_TEMPLATE:-}
      - CLOUD_QUARK_CANCELLED_TEMPLATE=${CLOUD_QUARK_CANCELLED_TEMPLATE:-}
      - CLOUD_TEMPLATE_LANGUAGE=${CLOUD_TEMPLATE_LANGUAGE:-pt_BR}
      - QUARK_INTEGRATION_ENABLED=${QUARK_INTEGRATION_ENABLED:-false}
      - QUARK_API_BASE_URL=${QUARK_API_BASE_URL:-https://api.quark.tec.br/clinic/ext}
      - QUARK_AUTH_TOKEN=${QUARK_AUTH_TOKEN:-}
      - QUARK_X_CHAVE_KEY=${QUARK_X_CHAVE_KEY:-}
      - QUARK_X_SECRET_KEY=${QUARK_X_SECRET_KEY:-}
      - QUARK_WHATSAPP_ID=${QUARK_WHATSAPP_ID:-}
      - QUARK_POLL_INTERVAL_SECONDS=${QUARK_POLL_INTERVAL_SECONDS:-300}
      - QUARK_STARTUP_DELAY_SECONDS=${QUARK_STARTUP_DELAY_SECONDS:-20}
      - QUARK_REQUEST_TIMEOUT_MS=${QUARK_REQUEST_TIMEOUT_MS:-15000}
      - QUARK_SYNC_HORIZON_DAYS=${QUARK_SYNC_HORIZON_DAYS:-365}
      - QUARK_TIMEZONE=${QUARK_TIMEZONE:-America/Sao_Paulo}
      - QUARK_DEFAULT_COUNTRY_CODE=${QUARK_DEFAULT_COUNTRY_CODE:-55}
      - QUARK_CLINIC_ADDRESS=${QUARK_CLINIC_ADDRESS:-}
      - QUARK_REMINDER_HOURS=${QUARK_REMINDER_HOURS:-24}
      - QUARK_SEND_INTERVAL_MIN_SECONDS=${QUARK_SEND_INTERVAL_MIN_SECONDS:-15}
      - QUARK_SEND_INTERVAL_MAX_SECONDS=${QUARK_SEND_INTERVAL_MAX_SECONDS:-45}
      - QUARK_MAX_MESSAGES_PER_HOUR=${QUARK_MAX_MESSAGES_PER_HOUR:-100}
      - QUARK_QUIET_HOURS_START=${QUARK_QUIET_HOURS_START:-20:00}
      - QUARK_QUIET_HOURS_END=${QUARK_QUIET_HOURS_END:-08:00}
      - QUARK_MAX_RETRY_ATTEMPTS=${QUARK_MAX_RETRY_ATTEMPTS:-5}
      - QUARK_PROCESSING_TIMEOUT_MINUTES=${QUARK_PROCESSING_TIMEOUT_MINUTES:-10}
      - QUARK_WORKER_POLL_INTERVAL_SECONDS=${QUARK_WORKER_POLL_INTERVAL_SECONDS:-5}
      - QUARK_DRY_RUN=${QUARK_DRY_RUN:-true}
      - QUARK_TEST_ALLOWLIST=${QUARK_TEST_ALLOWLIST:-}
      - QUARK_CANCEL_REASON=${QUARK_CANCEL_REASON:-Cancelado pelo paciente atraves da confirmacao no WhatsApp}
      - QUARK_APPOINTMENT_NOTICES_REQUIRE_OPT_IN=${QUARK_APPOINTMENT_NOTICES_REQUIRE_OPT_IN:-false}
      - TICKET_INACTIVITY_ENABLED=${TICKET_INACTIVITY_ENABLED:-false}
      - TICKET_INACTIVITY_TIMEOUT_MINUTES=${TICKET_INACTIVITY_TIMEOUT_MINUTES:-15}
      - TICKET_INACTIVITY_POLL_INTERVAL_SECONDS=${TICKET_INACTIVITY_POLL_INTERVAL_SECONDS:-30}
      - TICKET_INACTIVITY_CLAIM_TIMEOUT_MINUTES=${TICKET_INACTIVITY_CLAIM_TIMEOUT_MINUTES:-5}
      - TICKET_INACTIVITY_SEND_INTERVAL_MIN_SECONDS=${TICKET_INACTIVITY_SEND_INTERVAL_MIN_SECONDS:-15}
      - TICKET_INACTIVITY_SEND_INTERVAL_MAX_SECONDS=${TICKET_INACTIVITY_SEND_INTERVAL_MAX_SECONDS:-45}
      - DAILY_REPORT_ENABLED=${DAILY_REPORT_ENABLED:-false}
      - DAILY_REPORT_TEST_MODE=${DAILY_REPORT_TEST_MODE:-true}
      - DAILY_REPORT_TIME=${DAILY_REPORT_TIME:-17:00}
      - DAILY_REPORT_TIMEZONE=${DAILY_REPORT_TIMEZONE:-America/Sao_Paulo}
      - DAILY_REPORT_WHATSAPP_ID=${DAILY_REPORT_WHATSAPP_ID:-}
      - DAILY_REPORT_POLL_INTERVAL_SECONDS=${DAILY_REPORT_POLL_INTERVAL_SECONDS:-30}
      - DAILY_REPORT_SEND_INTERVAL_SECONDS=${DAILY_REPORT_SEND_INTERVAL_SECONDS:-20}
      - DAILY_REPORT_MAX_RETRY_ATTEMPTS=${DAILY_REPORT_MAX_RETRY_ATTEMPTS:-5}
      - DAILY_REPORT_ALLOW_WEEKENDS=${DAILY_REPORT_ALLOW_WEEKENDS:-true}
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD:-strongpassword}
      - DB_NAME=${MYSQL_DATABASE:-whaticket}
      - JWT_SECRET=${JWT_SECRET:?Set a unique secret with at least 32 characters}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set a different secret with at least 32 characters}
      - BACKEND_URL=${BACKEND_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PROXY_PORT=${PROXY_PORT:-8080}
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
    ports:
      - ${BACKEND_PORT:-8080}:3000
    volumes:
      - ./backend/public/:/usr/src/app/public/
      - ./backend/.wwebjs_auth/:/usr/src/app/.wwebjs_auth/
    networks:
      - whaticket

  frontend:
    ports:
      - ${FRONTEND_PORT:-3000}:80
      - ${FRONTEND_SSL_PORT:-3001}:443
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    environment:
      - URL_BACKEND=backend:3000
      - VITE_BACKEND_URL=${BACKEND_URL:-http://localhost}:${PROXY_PORT:-8080}/
      - VITE_QUARK_CLINIC_URL=${VITE_QUARK_CLINIC_URL:-https://ng.quarkclinic.com.br/}
      - FRONTEND_SERVER_NAME=${FRONTEND_SERVER_NAME}
      - BACKEND_SERVER_NAME=${BACKEND_SERVER_NAME}
    volumes:
      - ./ssl/certs/:/etc/nginx/ssl/
      - ./ssl/www/:/var/www/letsencrypt/
    networks:
      - whaticket

  mysql:
    image: ${MYSQL_ENGINE:-mariadb}:${MYSQL_VERSION:-10.6}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    volumes:
      - ./.docker/data/:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-whaticket}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-strongpassword}
      - TZ=${TZ:-America/Fortaleza}
    ports:
      - ${MYSQL_PORT:-3306}:3306
    restart: always
    networks:
      - whaticket
