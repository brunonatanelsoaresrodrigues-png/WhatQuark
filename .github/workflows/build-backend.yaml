name: Test build backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yaml"

  push:
    branches:
      - master
      - whatquark-master
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - run: npm run build
        working-directory: backend

      - name: Test changed services
        run: >-
          npx jest
          src/__tests__/unit/QuarkClinic
          src/__tests__/unit/Message
          src/__tests__/unit/PatientIntake
          src/__tests__/unit/Ticket
          src/__tests__/unit/Whatsapp
          --runInBand
          --coverage=false
        working-directory: backend
