name: whaticket

services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=8M
      - --max-connections=40
      - --performance-schema=OFF
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 768m
    cpus: 0.30
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 192m
    cpus: 0.10
    networks:
      - internal

  backend:
    image: whaticket-backend:custom-0973
    command:
      - sh
      - -c
      - >-
        npx sequelize
        --config dist/config/database.js
        --migrations-path dist/database/migrations
        --seeders-path dist/database/seeds
        db:migrate
        && node dist/server.js
    environment:
      NODE_ENV: production
      PORT: "3000"
      WHATSAPP_PROVIDER: whaileys
      LOG_LEVEL: info
      WHAILEYS_LOG_LEVEL: error
      DB_DIALECT: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      BACKEND_URL: https://api.bfontes.online
      FRONTEND_URL: https://atendimento.bfontes.online
      PROXY_PORT: "443"
      REDIS_URL: redis://redis:6379
      REDIS_DB: "0"
      TZ: America/Sao_Paulo
      QUARK_INTEGRATION_ENABLED: ${QUARK_INTEGRATION_ENABLED:-false}
      PATIENT_INTAKE_QUARK_AVAILABILITY_ENABLED: ${PATIENT_INTAKE_QUARK_AVAILABILITY_ENABLED:-true}
      PATIENT_INTAKE_QUARK_BOOKING_ENABLED: ${PATIENT_INTAKE_QUARK_BOOKING_ENABLED:-false}
      PATIENT_INTAKE_CONTEXT_TTL_MINUTES: ${PATIENT_INTAKE_CONTEXT_TTL_MINUTES:-240}
      PATIENT_INTAKE_CONTEXT_SECRET: ${PATIENT_INTAKE_CONTEXT_SECRET:-}
      QUARK_API_BASE_URL: ${QUARK_API_BASE_URL:-https://api.quark.tec.br/clinic/ext}
      QUARK_AUTH_TOKEN: ${QUARK_AUTH_TOKEN:-}
      QUARK_X_CHAVE_KEY: ${QUARK_X_CHAVE_KEY:-}
      QUARK_X_SECRET_KEY: ${QUARK_X_SECRET_KEY:-}
      QUARK_WHATSAPP_ID: ${QUARK_WHATSAPP_ID:-}
      QUARK_POLL_INTERVAL_SECONDS: ${QUARK_POLL_INTERVAL_SECONDS:-300}
      QUARK_STARTUP_DELAY_SECONDS: ${QUARK_STARTUP_DELAY_SECONDS:-20}
      QUARK_REQUEST_TIMEOUT_MS: ${QUARK_REQUEST_TIMEOUT_MS:-15000}
      QUARK_SYNC_HORIZON_DAYS: ${QUARK_SYNC_HORIZON_DAYS:-365}
      QUARK_TIMEZONE: ${QUARK_TIMEZONE:-America/Sao_Paulo}
      QUARK_DEFAULT_COUNTRY_CODE: ${QUARK_DEFAULT_COUNTRY_CODE:-55}
      QUARK_CLINIC_ADDRESS: ${QUARK_CLINIC_ADDRESS:-}
      QUARK_REMINDER_HOURS: ${QUARK_REMINDER_HOURS:-24,2}
      QUARK_SEND_INTERVAL_MIN_SECONDS: ${QUARK_SEND_INTERVAL_MIN_SECONDS:-60}
      QUARK_SEND_INTERVAL_MAX_SECONDS: ${QUARK_SEND_INTERVAL_MAX_SECONDS:-180}
      QUARK_MAX_MESSAGES_PER_HOUR: ${QUARK_MAX_MESSAGES_PER_HOUR:-30}
      QUARK_MAX_RECOVERY_MESSAGES_PER_HOUR: ${QUARK_MAX_RECOVERY_MESSAGES_PER_HOUR:-5}
      QUARK_QUIET_HOURS_START: ${QUARK_QUIET_HOURS_START:-20:00}
      QUARK_QUIET_HOURS_END: ${QUARK_QUIET_HOURS_END:-08:00}
      QUARK_MAX_RETRY_ATTEMPTS: ${QUARK_MAX_RETRY_ATTEMPTS:-5}
      QUARK_PROCESSING_TIMEOUT_MINUTES: ${QUARK_PROCESSING_TIMEOUT_MINUTES:-10}
      QUARK_WORKER_POLL_INTERVAL_SECONDS: ${QUARK_WORKER_POLL_INTERVAL_SECONDS:-5}
      QUARK_RECIPIENT_COOLDOWN_MINUTES: ${QUARK_RECIPIENT_COOLDOWN_MINUTES:-15}
      QUARK_DRY_RUN: ${QUARK_DRY_RUN:-true}
      QUARK_TEST_ALLOWLIST: ${QUARK_TEST_ALLOWLIST:-}
      QUARK_CANCEL_REASON: ${QUARK_CANCEL_REASON:-Cancelado pelo paciente atraves da confirmacao no WhatsApp}
      TICKET_INACTIVITY_ENABLED: ${TICKET_INACTIVITY_ENABLED:-false}
      TICKET_INACTIVITY_TIMEOUT_MINUTES: ${TICKET_INACTIVITY_TIMEOUT_MINUTES:-15}
      TICKET_INACTIVITY_POLL_INTERVAL_SECONDS: ${TICKET_INACTIVITY_POLL_INTERVAL_SECONDS:-30}
      TICKET_INACTIVITY_CLAIM_TIMEOUT_MINUTES: ${TICKET_INACTIVITY_CLAIM_TIMEOUT_MINUTES:-5}
      TICKET_INACTIVITY_SEND_INTERVAL_MIN_SECONDS: ${TICKET_INACTIVITY_SEND_INTERVAL_MIN_SECONDS:-15}
      TICKET_INACTIVITY_SEND_INTERVAL_MAX_SECONDS: ${TICKET_INACTIVITY_SEND_INTERVAL_MAX_SECONDS:-45}
      DAILY_REPORT_ENABLED: ${DAILY_REPORT_ENABLED:-false}
      DAILY_REPORT_TEST_MODE: ${DAILY_REPORT_TEST_MODE:-true}
      DAILY_REPORT_TIME: ${DAILY_REPORT_TIME:-17:00}
      DAILY_REPORT_TIMEZONE: ${DAILY_REPORT_TIMEZONE:-America/Sao_Paulo}
      DAILY_REPORT_WHATSAPP_ID: ${DAILY_REPORT_WHATSAPP_ID:-}
      DAILY_REPORT_POLL_INTERVAL_SECONDS: ${DAILY_REPORT_POLL_INTERVAL_SECONDS:-30}
      DAILY_REPORT_SEND_INTERVAL_SECONDS: ${DAILY_REPORT_SEND_INTERVAL_SECONDS:-20}
      DAILY_REPORT_MAX_RETRY_ATTEMPTS: ${DAILY_REPORT_MAX_RETRY_ATTEMPTS:-5}
      DAILY_REPORT_ALLOW_WEEKENDS: ${DAILY_REPORT_ALLOW_WEEKENDS:-true}
    ports:
      - "127.0.0.1:3101:3000"
    volumes:
      - backend_public:/usr/src/app/public
      - backend_auth:/usr/src/app/.wwebjs_auth
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: 0.50
    networks:
      - internal

  frontend:
    image: whaticket-frontend:custom-0973
    environment:
      VITE_BACKEND_URL: https://api.bfontes.online
      VITE_QUARK_CLINIC_URL: ${VITE_QUARK_CLINIC_URL:-https://ng.quarkclinic.com.br/}
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 192m
    cpus: 0.10
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mariadb_data:
  backend_public:
  backend_auth:
